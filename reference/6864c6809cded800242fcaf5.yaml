openapi: 3.0.0
info:
  title: RCS API
  description: >
    This API allows you to send RCS messages using a registered RCS Agent.
    Supports both Basic RCS messages (160 characters, SMS format) and Simple RCS
    messages (3072 characters with UTF-8 and emoji support). Includes
    intelligent SMS fallback for non-RCS capable devices and carrier failures.

    **Webhook Support:** RCS messages support webhook events for end-to-end
    status monitoring including SENT, DELIVERED, FAILED, and READ statuses.

    To use this API, you must have a valid API key and registered RCS Agent.
  version: 1.0.0
  x-go-package: github.com/oapi-codegen/runtime
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        All API requests require your API credentials, you will find them once
        logged into your account on the SETTINGS page. Scroll down to API
        Settings to find your API key.
  schemas:
    Text:
      type: object
      description: Text content for the message.
      properties:
        message:
          type: string
          maxLength: 3072
          description: >
            The text message body.


            **Message Types:**

            - **Basic RCS Messages**: Up to 160 characters (SMS format in RCS)

            - **Simple RCS Messages**: Up to 3072 characters with emoji and
            UTF-8 support
      required:
        - message
    TextContent:
      type: object
      properties:
        text:
          $ref: '#/components/schemas/Text'
      required:
        - text
    SMSFallback:
      type: object
      description: >
        Provides intelligent fallback for non-RCS capable devices and carrier
        delivery issues. If the RCS message fails, the SMS will send the
        configured message to the recipeint instead.
      properties:
        message:
          type: string
          description: >-
            The message to send via SMS. SMS messages are subject to certain
            character limitations, please read our SMS documentation for
            details.
      required:
        - message
    RcsRequest:
      type: object
      properties:
        sender:
          type: string
          description: >
            RCS Agent ID provided to you that refers to your registered RCS
            Agent. Unlike WhatsApp, SMS, and MMS, RCS doesn't send through a
            sender phone number. Messages are sent through agents.


            - Must be a registered RCS Agent identifier

            - Example: "DemoSender"

            - Can be alphanumeric or numeric.
        recipient:
          type: string
          format: phone
          description: |
            The destination number for delivery.
                    <br>Can be either in local format or in international format.
                    <br>For international format, it should follow E.164 standard.
                    [http://en.wikipedia.org/wiki/E.164](http://en.wikipedia.org/wiki/E.164)
                    <br>Can only send to Australia currently.
                    <br>Examples of conversions to E.164 format:
                    <br>Australia 0438 333 061 => 61438333061
        content_type:
          type: string
          description: Type of the message content (currently only text supported).
          enum:
            - text
        content:
          type: object
          description: >
            The message content to be sent.


            - Supports both Basic RCS messages (160 characters) and Simple RCS
            messages (3072 characters)

            - UTF-8 and emoji support included
          oneOf:
            - $ref: '#/components/schemas/TextContent'
        sms_fallback:
          $ref: '#/components/schemas/SMSFallback'
        message_ref:
          type: string
          x-go-type-skip-optional-pointer: true
          description: >
            A reference supplied by your system. Maximum length of 500
            characters.

            <br><br>This reference will be passed back in webhooks so that you
            can relate events to messages you sent.

            <br><br>For example, being able to relate a Link Hit event to a
            specific sent message.
      required:
        - sender
        - recipient
        - content_type
        - content
      example:
        sender: DemoSender
        recipient: '+447903749662'
        content_type: text
        content:
          text:
            message: |-
              Hi Michael,
              Just a quick reminder. You are amazing!!
              Reply STOP to opt out.
        message_ref: order-12345
    RcsResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the message.
        message_ref:
          type: string
          x-go-type-skip-optional-pointer: true
          description: Optional reference ID set by the user for the message.
        sender:
          type: string
          description: Registered RCS Agent ID.
        recipient:
          type: string
          description: Recipient phone number in international format.
        content_type:
          type: string
          description: Type of the message content.
          enum:
            - text
        content:
          type: object
          description: Content of the message.
          oneOf:
            - $ref: '#/components/schemas/TextContent'
        sms_fallback:
          $ref: '#/components/schemas/SMSFallback'
        created_at:
          type: string
          format: date-time
          description: >-
            Timestamp in ISO 8601 (`YYYY-MM-DDTHH:MM:SSZ`) when the message was
            created on the server.
      required:
        - id
        - sender
        - recipient
        - content_type
        - content
        - created_at
      example:
        id: 6fdae71c-dad7-4c36-9734-a69693ecf3b4
        message_ref: order-12345
        sender: DemoSender
        recipient: '+447903749662'
        content_type: text
        content:
          text:
            message: |-
              Hi Michael,
              Just a quick reminder. You are amazing!!
              Reply STOP to opt out.
        created_at: '2021-01-01T00:00:00Z'
  responses:
    SuccessResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - allOf:
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Success response payload
                    required:
                      - data
                  - type: object
                    properties:
                      request:
                        type: object
                        description: Optional metadata (e.g. requestId, traceId)
                      meta:
                        type: object
                        description: Optional pagination, feature flags, etc.
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RcsResponse'
security:
  - ApiKeyAuth: []
paths:
  /v2/rcs:
    post:
      tags:
        - Beta
      summary: Send an RCS message
      description: |
        This endpoint is in beta and may change in future versions.
        Sends an RCS message to a single recipient.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RcsRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          description: Input Validation Error
          content:
            application/json:
              schema:
                allOf:
                  - allOf:
                      - type: object
                        properties:
                          error:
                            type: object
                            description: Problem details on error
                        required:
                          - error
                      - $ref: >-
                          #/components/responses/SuccessResponse/content/application~1json/schema/allOf/0/allOf/1
                  - type: object
                    properties:
                      error:
                        description: >
                          This problem occurs when the request is deemed
                          unprocessable.


                          Your client issued a request that failed validation.
                          Certain validation libraries return multi-errors and
                          cannot be easily parsed into discreet types. This
                          problem type, afforded the provider with the ability
                          to surface all validation errors and negate the need
                          for a trial and error workflow on your side.
                        type: object
                        allOf:
                          - description: >
                              A Problem Details object (RFC 9457).


                              Additional properties specific to the problem type
                              may be present.
                            type: object
                            properties:
                              type:
                                type: string
                                description: >-
                                  string providing an URI formatted according to
                                  IETFÂ RFCÂ 3986.
                                format: uri
                              title:
                                type: string
                                description: >-
                                  A short summary of the problem type. Written
                                  in English and readable for engineers (usually
                                  not suited for non technical stakeholders and
                                  not localized).
                              detail:
                                type: string
                                description: >-
                                  A human-readable explanation specific to this
                                  occurrence of the problem
                              status:
                                type: integer
                                description: >-
                                  The HTTP status code corresponding to this
                                  error.
                            required:
                              - type
                              - title
                              - detail
                              - status
                            example:
                              type: https://developers.kudosity.com/errors
                              title: Description of the type of problem that occurred
                              detail: >-
                                Description of specific occurrence of the
                                problem
                              status: 400
                          - properties:
                              issues:
                                description: >-
                                  An array of issues detected during input
                                  validation.
                                type: array
                                x-go-type-skip-optional-pointer: true
                                items:
                                  type: object
                                  description: |
                                    An issue detected during input validation.
                                  properties:
                                    name:
                                      type: string
                                      description: >-
                                        The name of the param or field that
                                        failed validation.
                                      x-go-type-skip-optional-pointer: true
                                    code:
                                      type: integer
                                      description: The internal api specific error code.
                                      x-go-type-skip-optional-pointer: true
                                    message:
                                      description: The error message
                                      type: string
                                      x-go-type-skip-optional-pointer: true
                        example:
                          type: >-
                            https://developers.kudosity.com/errors#input-validation
                          title: Invalid Input Parameters
                          detail: >-
                            The request contained invalid, or malformed
                            parameters.
                          status: 422
                          issues:
                            - field: account_id
                              code: 2200
                              message: The account_id supplied was invalid.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: >-
                      #/paths/~1v2~1rcs/post/responses/400/content/application~1json/schema/allOf/0
                  - type: object
                    properties:
                      error:
                        description: >
                          This problem occurs when the requested resource could
                          not be found.


                          Your client application tried to access a resource
                          that does not exist (or could not be found). Please
                          review how your users initiated such a request.
                        type: object
                        allOf:
                          - $ref: >-
                              #/paths/~1v2~1rcs/post/responses/400/content/application~1json/schema/allOf/1/properties/error/allOf/0
                        example:
                          type: https://developers.kudosity.com/errors#not-found
                          title: Not Found
                          detail: The requested resource was not found
                          status: 404
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: >-
                      #/paths/~1v2~1rcs/post/responses/400/content/application~1json/schema/allOf/0
                  - type: object
                    properties:
                      error:
                        description: >
                          This problem occurs when the server encounters an
                          unexpected condition that prevents it from fulfilling
                          the request.


                          Your client application did everything correct.
                          Unfortunately our API encountered a condition that
                          resulted in this problem.
                        type: object
                        allOf:
                          - $ref: >-
                              #/paths/~1v2~1rcs/post/responses/400/content/application~1json/schema/allOf/1/properties/error/allOf/0
                        example:
                          type: https://developers.kudosity.com/errors#server-error
                          title: Server Error
                          detail: The server encountered an unexpected error
                          status: 500
