          example: https://webhook.site/uuid
        rate_limit:
          type: integer
          description: Rate limit for the webhook in requests per second.
          example: 10
        is_sandbox:
          type: boolean
          description: Indicates if the webhook is in sandbox mode (deprecated).
          example: false
        created_at:
          type: string
          format: date-time
          description: Timestamp when the webhook was created.
          example: '2025-04-14T00:59:32.75819Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the webhook was last updated.
          example: '2025-04-14T00:59:32.75819Z'
      required:
        - id
        - name
        - url
        - rate_limit
        - is_sandbox
        - created_at
        - updated_at
    WebhookDeleteResponse:
      type: object
      description: Webhook deletion confirmation response.
      properties:
        message:
          type: string
          description: Confirmation message
          example: deleted
      required:
        - message
    WebhookListResponse:
      type: object
      description: List of webhooks response.
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponse'
    WebhookRequest:
      type: object
      properties:
        event_type:
          allOf:
            - $ref: '#/components/schemas/EventTypeEnum'
          description: >-
            Type of event to subscribe to. Deprecated - use filter.event_type
            instead.
          example: SMS_STATUS
          deprecated: true
        filter:
          type: object
          description: >-
            Filter to apply to webhook events. The filters are applied
            differently based on the event type:


            - For status events (`SMS_STATUS`, `MMS_STATUS`, etc.): `sender`,
            `status`,
              `message_ref`, and `campaign_id` filters are applied to the **status** payload.
            - For `LINK_HIT` events: `sender` and `message_ref` filters are
            applied to
              the `source_message` in the link-hit payload.
            - For `OPT_OUT` events: `sender` and `message_ref` filters are
            applied to
              the `source_message` in the opt-out payload.
            - For inbound events (`SMS_INBOUND`, `MMS_INBOUND`, etc.): `sender`
            and
              `message_ref` filters are applied to the `last_message` in the inbound payload.

            Within each filter array (e.g., sender, status, message_ref), the
            conditions are combined using an OR logic. For example, if multiple
            senders are specified, the webhook will trigger if the event matches
            any of the specified senders. Between different filters (e.g.,
            sender and status), the conditions are combined using an AND logic.
            For example, the webhook will trigger only if the event matches both
            the specified sender and the specified status.
          properties:
            event_type:
              type: array
              description: Types of events to subscribe to
              items:
                $ref: '#/components/schemas/EventTypeEnum'
              example:
                - SMS_STATUS
                - SMS_INBOUND
            sender:
              type: array
              description: Filter by sender
              items:
                type: string
              example:
                - '+61412345678'
                - '+61487654321'
            status:
              type: array
              description: Filter by message status (only applicable for status events)
              items:
                type: string
              example:
                - DELIVERED
                - FAILED
            message_ref:
              type: array
              description: Filter by message ref
              items:
                type: string
              example:
                - ref123
                - ref456
            campaign_id:
              type: array
              description: Filter by campaign ID
              items:
                type: string
              example:
                - campaign_123
                - campaign_456
        name:
          type: string
          description: Name of the webhook
          minLength: 2
          maxLength: 100
          example: My Webhook
          x-oapi-codegen-extra-tags:
            valid: length(2|100)
        url:
          type: string
          description: URL (https) that accepts JSON encoded POST requests
          format: uri
          example: https://example.com/webhook
          x-oapi-codegen-extra-tags:
            valid: required,webhook_url
        rate_limit:
          type: integer
          description: >-
            Rate limit for your URL in requests per second. Max 10,000/sec. If
            set to 0 or not specified, the default system limit will be applied.
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            valid: range(0|10000)
        is_sandbox:
          type: boolean
          deprecated: true
          description: >-
            Deprecated. Use a sandbox account instead, or contact support to
            request one.
          x-go-type-skip-optional-pointer: true
      required:
        - name
        - url
