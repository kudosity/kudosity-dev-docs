openapi: 3.0.3
info:
  title: Transmit Message API
  description: Transmit APIs
  version: 1.0.0
  x-go-package: github.com/oapi-codegen/runtime
servers:
  - url: https://api.transmitmessage.com
security:
  - ApiKeyAuth: []
tags:
  - name: MMS
    description: The primary method of sending MMS
  - name: SMS
    description: >-
      The primary method of sending SMS.


      You can elect to pass us the recipient numbers from your database each
      time you make an API call.


      In order to send to a local number for a recipient the Sender virtual
      number needs to be in the same country.


      You can pass us the recipient number in international format and we will
      deliver your message with the Sender virtual number on your account for
      the same country.


      If you do not have a Sender virtual number for the same country we will
      use a local number for the country you are sending to in order to deliver
      your message.


      List of countries we currently deliver to: [Global Delivery
      List](https://help.kudosity.com/support/solutions/articles/44001077065-global-sms-delivery-list)
  - name: Webhook
    description: >-
      Our webhooks API allows you to subscribe to events for SMS, MMS, and RCS
      messages. Using them requires you to have URLs (https) configured on your
      account that can receive POST requests over the internet.


      The `event_type` field is an enum that specifies which event to subscribe
      to:


      - LINK_HIT

      - OPT_OUT

      - MMS_STATUS

      - MMS_INBOUND

      - SMS_INBOUND

      - SMS_STATUS

      - RCS_STATUS
          

      For status events, the nested `status` field is an enum with these values:


      - FAILED: Failed because of an error from the carrier or handset.
          
      - SENT: Submitted to the carrier.

      - ACCEPTED: Accepted by the carrier and delivery may have been attempted
      (but is not confirmed).

      - DELIVERED: Delivered to handset.

      - SOFT_BOUNCE: Undeliverable due to handset being switched off, out of
      range or other temporary deliverability issue.

      - HARD_BOUNCE: Handset was disconnected.

      - OTHER: Any other status from the carrier.
          

      ## Link Hit


      The `LINK_HIT` event is triggered any time a recipient visits a link that
      is tracked. Track Links is an optional flag on the send message API calls.
      Along with the URL that was being tracked is a hits field indicating how
      many visits this tracked link has in total and a source_message which
      contains the track link sent to the recipient.


      ###### Example Payloads


      ```json Hit link in MMS {
        "event_type": "LINK_HIT",
        "timestamp": "2021-05-06T05:19:42Z",
        "link_hit": {
          "hits": 1,
          "url": "https://www.example.com/abc",
          "source_message": {
            "type": "MMS",
            "id": "b50e4dc1-e57f-459c-a15c-526bee00a4c4",
            "message": "Hey, Check this out! http://clckme.info/KYhSsuIH Opt-out reply STOP",
            "message_ref": "D701",
            "recipient": "61435790000",
            "sender": "61481074191",
            "subject": "Hello",
            "content_urls": [
              "https://res.cloudinary.com/burstsms/image/upload/v1618798563/284KB_qgqtbe.jpg"
            ]
          }
        }
      } ``` ```json Hit link in SMS {
        "event_type": "LINK_HIT",
        "timestamp": "2021-07-20T23:14:04Z",
        "link_hit": {
          "hits": 1,
          "url": "https://www.example.com/abc",
          "source_message": {
            "type": "SMS",
            "id": "faf68308-16cd-4cf9-aef7-47342bd405be",
            "message": "Hey, Check this out! http://clckme.info/KYhSsuIH for Opt-out reply STOP or hit opt out link - http://nsub.me/vqHTcCsh ",
            "message_ref": "D301",
            "recipient": "61435795809",
            "sender": "61481074185"
          }
        }
      } ```

      ## Opt Out


      The `OPT_OUT` event is triggered when a recipient has visited an opt-out
      link in a message they have received or by sending a message with the text
      "STOP".


      Using parameter \[opt-out-link\] in message body, inserts the opt-out
      link.


      The source field will be set according to the method a recipient has used
      to opt-out and contain a value of either link or SMS.
        

      ###### Example Payloads


      ```json Opt out via link {
        "event_type": "OPT_OUT",
        "timestamp": "2021-05-06T05:16:20Z",
        "opt_out": {
          "source": "LINK_HIT",
          "source_message": {
            "type": "SMS",
            "id": "a51ebe4e-a412-440e-a8d9-464e68a521cc",
            "message": "Hey, Check this out! http://clckme.info/KYhSsuIH for Opt-out reply STOP or hit opt out link - http://nsub.me/vqHTcCsh",
            "message_ref": "ncc5009d",
            "recipient": "61435790000",
            "sender": "61481074190"  
          }
        }
      } ``` ```json Opt out via message {
        "event_type": "OPT_OUT",
        "timestamp": "2021-05-06T05:16:20Z",
        "opt_out": {
          "source": "SMS_INBOUND",
          "source_message": {
            "type": "SMS",
            "id": "a51ebe4e-a412-440e-a8d9-464e68a521cc",
            "message": "Hey, Check this out! http://clckme.info/KYhSsuIH for Opt-out reply STOP or hit opt out link - http://nsub.me/vqHTcCsh",
            "message_ref": "ncc5009d",
            "recipient": "61435790000",
            "sender": "61481074190"
          }
        }
      } ```

      ## MMS Status


      The `MMS_STATUS` event data is posted to you for changes to an MMS message
      status. These are currently only comprised of internal statuses (SENT,
      FAILED).


      ###### Example Payload


      ```json {
        "event_type": "MMS_STATUS",
        "timestamp": "2021-05-06T05:19:33Z",
        "status": {
          "type": "MMS",
          "id": "b50e4dc1-e57f-459c-a15c-526bee00a4c4",
          "message_ref": "D7001",
          "recipient": "61435790000",
          "sender": "61481074191",
          "status": "SENT"
        }
      } ```

      ## SMS Inbound


      The `SMS_INBOUND` event is posted to you on receipt of an SMS sent from a
      recipient to one of the senders listed on your account. For convenience we
      will try and find a message that you have sent to this recipient from that
      sender and supply it as the `last_message` field. This is useful for
      determining if an inbound message is potentially a reply. The `routed_via`
      field will display when a shared local number has been used to deliver
      your message.


      ###### Example Payload


      ```json {
        "event_type": "SMS_INBOUND",
        "timestamp": "2021-05-06T05:16:33Z",
        "mo": {
          "type":"SMS",
          "id": "alss-2way-605b31c7-d2c49104",
          "message": "Stop",
          "recipient": "61481074190",
          "routed_via": "447507333300",
          "sender": "447507222200",
          "last_message": {
            "type":"SMS",
            "id": "a51ebe4e-a412-440e-a8d9-464e68a521cc",     
            "message": "Hey, check this out!",
            "message_ref": "ncc5009d",
            "recipient": "447507222200",
            "routed_via": "447507333300",
            "sender": "61481074190"
          }
        }
      } ```

      ## SMS Status


      The `SMS_STATUS` event data is posted to you for changes to a SMS message
      status. Multiple status events can be triggered for a single message.


      The `routed_via` field will display when a shared local number has been
      used to deliver your message.


      ###### Example Payload


      ```json {
        "event_type": "SMS_STATUS",
        "timestamp": "2021-05-06T05:16:07Z",
        "status": {
          "type": "SMS",
          "id": "a51ebe4e-a412-440e-a8d9-464e68a521cc",
          "message_ref": "ncc5009d",
          "recipient": "447507222200",
          "routed_via": "447507333300",
          "sender": "61481074190",
          "status": "SENT"
        }
      } ```

      ## RCS Status


      The `RCS_STATUS` event data is posted to you for changes to an RCS message
      status. RCS supports enhanced status tracking including read receipts.


      RCS-specific statuses include:


      - SENT: Submitted to the carrier.

      - DELIVERED: Delivered to handset.

      - FAILED: Failed because of an error from the carrier or handset.

      - READ: Message was read by the recipient (RCS-specific feature).


      ###### Example Payload


      ```json {
        "event_type": "RCS_STATUS",
        "timestamp": "2025-01-07T05:16:07Z",
        "webhook_id": "fd0e6485-b905-44c1-bd55-fee1d0d6d864",
        "webhook_name": "RCS Status Webhook",
        "status": {
          "type": "RCS",
          "id": "6fdae71c-dad7-4c36-9734-a69693ecf3b4",
          "message_ref": "order-12345",
          "recipient": "+447903749662",
          "sender": "DemoSender",
          "status": "READ"
        }
      } ```
paths:
  /v2/whatsapp:
    post:
      tags:
        - WhatsApp
      summary: Send WhatsApp message.
      description: >-
        Sends a single templated message to a single recipient. Templates need
        to be registered and pre-approved by WhatsApp.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          $ref: '#/components/responses/InputValidationResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/rcs:
    post:
      tags:
        - RCS
      summary: Send an RCS message
      description: |
        This endpoint is in beta and may change in future versions.
        Sends an RCS message to a single recipient.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RcsRequest'
      responses:
        '200':
          $ref: '#/components/responses/RCSSuccessResponse'
        '400':
          $ref: '#/components/responses/InputValidationResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/sms/{id}:
    get:
      tags:
        - SMS
      summary: Get SMS
      description: >-
        Retrieves information about an existing SMS message. You only need to
        supply the unique message id that was returned upon message creation.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          description: Unique ID of the sent SMS
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single SMS message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSResponse'
        '404':
          description: SMS not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SMS not found
  /v2/sms:
    get:
      tags:
        - SMS
      summary: List SMS
      description: >-
        Retrieves a list of SMS messages. You can limit the number of messages
        returned and filter by properties listed in the parameters section.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: query
          in: query
          description: |
            Filter query parameters are added to the URL. Use as:
            ?limit=1&page=2&start_date=2024-01-01T00:00:00Z
          schema:
            $ref: '#/components/schemas/ListSMSRequest'
      responses:
        '200':
          description: A list of SMS messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSMSResponse'
    post:
      tags:
        - SMS
      summary: Send SMS
      description: >-
        Send a message from sender to recipient using the values shown in the
        parameters section.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSMSRequest'
      responses:
        '200':
          description: The SMS that was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSResponse'
  /v2/mms:
    post:
      tags:
        - MMS
      summary: Send MMS
      description: >-
        The Send MMS endpoint allows you to send multimedia messages (MMS) to
        recipients. 
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MMSSendRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 6fdae71c-dad7-4c36-9734-a69693ec2318
                recipient: '61435795809'
                sender: '61481074185'
                country: AU
                subject: USS Enterprise
                message: Check out this amazing specimen.
                message_ref: ncc1701d
                content_urls:
                  - >-
                    http://res.cloudinary.com/burstsms/image/upload/v1590111670/enterprise-d_ghf9t8.jpg
                status: pending
                track_links: true
                created_at: '2022-03-29T04:42:01.631708761Z'
                updated_at: '2022-03-29T04:42:01.631708761Z'
  /v2/mms/{id}:
    get:
      tags:
        - MMS
      summary: Get MMS
      description: >-
        This request retrieves the information of an existing sent MMS message.
        You only need to supply the unique message id that was returned upon
        creation.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          description: Unique ID of the sent MMS
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single MMS message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MMSResponse'
              example:
                id: 6fdae71c-dad7-4c36-9734-a69693ec2318
                recipient: '61435795809'
                sender: '61481074185'
                country: AU
                subject: USS Enterprise
                message: Check out this amazing specimen.
                message_ref: ncc1701d
                content_urls:
                  - >-
                    http://res.cloudinary.com/burstsms/image/upload/v1590111670/enterprise-d_ghf9t8.jpg
                status: sent
                track_links: true
                created_at: '2022-03-29T04:42:01.631708Z'
                updated_at: '2022-03-29T04:42:01.776094Z'
        '400':
          description: Invalid MMS ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid MMS ID
        '404':
          description: MMS not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: MMS not found
  /v2/webhook:
    post:
      tags:
        - Webhook
      summary: Create Webhook
      security:
        - ApiKeyAuth: []
      description: >-
        We use webhooks to let your application know when events happen, such as
        receiving an SMS message. When the event occurs, the system makes an
        HTTP request (usually a POST) to the URL you configured for the webhook.
        The request will include details of the event such as the incoming phone
        number or the body of an incoming message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: >-
                      Validation Error: rate_limit: greater than the maximum
                      value of 10000
    get:
      tags:
        - Webhook
      summary: Retrieve all webhooks
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
  /v2/webhook/{id}:
    get:
      tags:
        - Webhook
      summary: Get a webhook by ID
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          description: Unique ID of the webhook
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Webhook not found
    put:
      tags:
        - Webhook
      summary: Update Webhook
      description: >-
        Updates the webhook. Any fields not provided in the request body will
        reset to their default values.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          description: Unique identifier for the webhook
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Validation Error: event_type: required'
    delete:
      tags:
        - Webhook
      summary: Delete Webhook
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
          description: Unique ID of the webhook
      responses:
        '200':
          description: Webhook deletion confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeleteResponse'
        '400':
          description: Invalid webhook ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid webhook ID
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Webhook not found
components:
  schemas:
    Text:
      type: object
      description: Text content for the message.
      properties:
        message:
          type: string
          description: The text message body.
      required:
        - message
    Template:
      type: object
      description: Template details for the message content.
      properties:
        name:
          type: string
          description: |
            The **exact name** of the WhatsApp template.

            - **Format:** Lowercase, alphanumeric, underscores only.
            - **Example:** `order_confirmation`
            - **Must be pre-approved** in your WhatsApp Business account.
        parameters:
          type: array
          description: >
            The **dynamic values** to populate placeholdes in the template
            message.


            - The number of parameters **must match** the template placeholders.

            - Supports **text only** (strings). Other types (e.g., images,
            documents) are not allowed.

            - **Example Usage:**
              - Template: `"Hello, {1}! Your order {2} has been shipped."`
              - Parameters: `["Tony", "#12345"]`
              - Final message: `"Hello, Tony! Your order #12345 has been shipped."`
          items:
            type: string
        locale:
          type: string
          x-go-type-skip-optional-pointer: true
          description: >-
            Optional locale for the template (e.g., en_US), if not provided, the
            default locale is `en`.
      required:
        - name
    TextContent:
      type: object
      properties:
        text:
          $ref: '#/components/schemas/Text'
      required:
        - text
    TemplateContent:
      type: object
      properties:
        template:
          $ref: '#/components/schemas/Template'
      required:
        - template
    Custom:
      type: object
      description: Custom content following the Meta Cloud API guidelines.
      additionalProperties: true
    CustomContent:
      type: object
      properties:
        custom:
          $ref: '#/components/schemas/Custom'
      required:
        - custom
    SMSFallback:
      type: object
      nullable: true
      description: SMS fallback message details.
      properties:
        message:
          type: string
          description: The message to send via SMS.
      required:
        - message
    WhatsappRequest:
      type: object
      properties:
        sender:
          type: string
          description: |
            Registered WhastApp sender number.

             - Must be in **international format** <a href="http://en.wikipedia.org/wiki/E.164">E.164 format</a> (e.g., +14155238886).
             - Number must be registered with the WhatsApp Business API.
        recipient:
          type: string
          format: phone
          description: >
            Recipient phone number in international format.


            - Must follow **E.164 format** (e.g., `+14155238886` for a US
            number).

            - No spaces, dashes, or special characters.

            - The recipient must **have an active WhatsApp account**.

            - Ensure the recipient **has opted in** to receive WhatsApp
            messages.
        content_type:
          type: string
          description: Type of the message content (e.g., text, template, custom).
          enum:
            - text
            - template
            - custom
        content:
          type: object
          description: >
            The message content to be sent.


            - Must follow the WhastApp-approved **template format** or be a
            **custom object** following the Meta Cloud API guidelines.

            - **Example JSON (Text Content):**
              ```json
              {
                "text": {
                  "message": "hello, world!",
                }
              }
              ```
            - **Example JSON (Template Content):**
              ```json
              {
                "template": {
                  "name": "order_update",
                  "parameters": ["123456"]
                }
              }
              ```
            - **Example JSON (Custom Content):**
              ```json
              {
                "custom": {
                  "type": "template",
                  "template": {
                    "name": "template_img_simple_1",
                    "language": {
                      "code": "en",
                      "policy": "deterministic"
                    },
                    "components": [
                      {
                        "type": "HEADER",
                        "parameters": [
                          {
                            "type": "image",
                            "image": {
                              "link": "https://image-test.jpg"
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              }
              ```
          oneOf:
            - $ref: '#/components/schemas/TextContent'
            - $ref: '#/components/schemas/TemplateContent'
            - $ref: '#/components/schemas/CustomContent'
        sms_fallback:
          $ref: '#/components/schemas/SMSFallback'
        message_ref:
          type: string
          x-go-type-skip-optional-pointer: true
          description: >
            A unique reference ID supplied by your system to track messages.


            - **Maximum Length:** 500 characters.

            - This `message_ref` will be included in webhook events, allowing
            you to correlate sent messages with received events.


            **Example Usage:**
             - Sending a message with `message_ref: "order-12345"`
             - Receiving a delivery webhook containing `message_ref: "order-12345"`, confirming it was delivered.
      required:
        - sender
        - recipient
        - content_type
        - content
      example:
        sender: '14155238886'
        recipient: '61411122211'
        content_type: template
        content:
          template:
            name: welcome_new_customer
            parameters:
              - Joe
        message_ref: optional-ref-123
    WhatsappResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the message.
        message_ref:
          type: string
          x-go-type-skip-optional-pointer: true
          description: Optional reference ID set by the user for the message.
        sender:
          type: string
          format: phone
          description: Registered WhatsApp sender number in international format.
        recipient:
          type: string
          format: phone
          description: WhatsApp recipient phone number in international format.
        content_type:
          type: string
          description: Type of the message content (e.g., template).
        content:
          type: object
          description: Content details for the message.
          oneOf:
            - $ref: '#/components/schemas/TextContent'
            - $ref: '#/components/schemas/TemplateContent'
            - $ref: '#/components/schemas/CustomContent'
        sms_fallback:
