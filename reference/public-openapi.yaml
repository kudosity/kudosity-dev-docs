            valid: required
        message_ref:
          type: string
          maxLength: 500
          description: >
            A reference supplied by your system. This reference will be passed
            back in webhooks so that you can relate events to messages you sent.
            For example, being able to relate a Link Hit event to a specific
            sent message.
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            valid: length(0|500)
        sender:
          type: string
          description: >
