    EventType:
      type: string
      enum:
        - LINK_HIT
        - OPT_OUT
        - MMS_STATUS
        - SMS_INBOUND
        - SMS_STATUS
        - MMS_INBOUND
        - WHATSAPP_STATUS
        - WHATSAPP_INBOUND
        - RCS_STATUS
        - RCS_INBOUND
      description: >
        Event type string values:

        - LINK_HIT: Link hit event when a recipient visits a tracked link

        - OPT_OUT: Opt out event when a recipient visits an opt-out link or by
        sending a message with the text "STOP"

        - MMS_STATUS: Status change for a MMS messages. Currently only comprised
        of internal statuses (sent, failed)

        - SMS_INBOUND: Inbound SMS sent from a recipient back to the sender

        - SMS_STATUS: Status change for a SMS message. Includes internal
        statuses (sent, failed) and delivery receipts (soft_bounce, hard_bounce,
        delivered, undelivered). Multiple status events can be triggered for a
        single message

        - MMS_INBOUND: Inbound MMS sent from a recipient back to the sender

        - WHATSAPP_STATUS: Status change for Whatsapp messages

        - WHATSAPP_INBOUND: Inbound Whatsapp sent from a recipient back to the
        sender

        - RCS_STATUS: Status change for RCS messages

        - RCS_INBOUND: Inbound RCS sent from a recipient back to the sender
    MessageType:
      type: string
      enum:
        - MMS
        - SMS
        - WHATSAPP
        - RCS
      description: |
        Message type values:
        - MMS: Multimedia Messaging Service
        - SMS: Short Message Service
        - WHATSAPP: WhatsApp message
        - RCS: Rich Communication Services
    MessageStatus:
      type: string
      enum:
        - INVALID
        - PENDING
        - SENT
        - FAILED
        - DELIVERED
        - ACCEPTED
        - SOFT_BOUNCE
        - HARD_BOUNCE
        - OTHER
        - REJECTED
        - PENDING_APPROVAL
        - SUBMITTED
        - UNDELIVERABLE
        - READ
      description: >
        Message delivery status values:

        - INVALID: Invalid status

        - PENDING: Queued for processing

        - SENT: Submitted to the provider

        - FAILED: Failed because of an error from the provider, a carrier, or
        the handset

        - DELIVERED: Delivered to handset

        - ACCEPTED: Accepted by the provider and delivery might have been
        attempted (but is not confirmed)

        - SOFT_BOUNCE: Undeliverable due to handset being switched off, out of
        range or other temporary deliverability issue

        - HARD_BOUNCE: Handset was disconnected

        - OTHER: Any other DLR status from the provider

        - REJECTED: Message pending approval was rejected by the Kudosity
        support team

        - PENDING_APPROVAL: Message is pending approval by the Kudosity support
        team

        - SUBMITTED: Message is submitted to the provider

        - UNDELIVERABLE: Message is undeliverable

        - READ: Message is read by the recipient
