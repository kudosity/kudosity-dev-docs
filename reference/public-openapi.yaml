            on the handset.

            Sender number must be assigned to your account for the country you
            are sending to. Contact us to get sender number(s) registered to
            your account.

            Sender number functionality varies by country. You can send from an
            alphanumeric sender if it is available for the destination country.

            Global SMS delivery list:
            https://support.transmitsms.com/s/article/page-products-connectivity-global-delivery-list


            Alphanumeric senders (which cannot be replied to) have a maximum of
            11 characters. Only letters, numbers, underscore, hyphen or space
            are allowed and they are included in the total character count.
            (Consecutive underscore, hyphen, space is not allowed.)
          x-oapi-codegen-extra-tags:
            valid: required
        recipient:
          type: string
          description: >
            The destination number for delivery.

            Can be either in local format or in international format. Must be in
            the same country as the sender.

            For international format, it should follow E.164 standard.
            http://en.wikipedia.org/wiki/E.164


            Examples of conversions to E.164 format:
              Australia 0438 333 061 => 61438333061
              New Zealand 0212172782 => 64212172782
              USA (281) 869-1226 => 12818691226
          x-oapi-codegen-extra-tags:
            valid: required
        track_links:
          type: boolean
          description: >
            Enable the link tracking feature which replaces links in outbound
            messages with shortened links. This allows us to track when
            recipients view links.
