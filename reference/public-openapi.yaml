            - Supports both Basic RCS messages (160 characters) and Simple RCS
            messages (3072 characters)

            - UTF-8 and emoji support included
          oneOf:
            - $ref: '#/components/schemas/RCSTextContent'
        sms_fallback:
          $ref: '#/components/schemas/RCSSMSFallback'
        message_ref:
