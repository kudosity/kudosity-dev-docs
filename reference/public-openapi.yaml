        - FAILED
        - DELIVERED
        - ACCEPTED
        - SOFT_BOUNCE
        - HARD_BOUNCE
        - OTHER
        - REJECTED
        - PENDING_APPROVAL
        - SUBMITTED
        - UNDELIVERABLE
        - READ
