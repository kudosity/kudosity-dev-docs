    SendSMSRequest:
      type: object
      properties:
        message:
          type: string
          description: >
            Body text of the message.

            The message will be split into multiple parts if required. A part is
            160 characters for a single SMS or 153 characters per part for
            multi-part SMS. If the message contains Unicode UTF8 encoded
            characters such as emoji’s or non latin character sets, then a
            single part is 70 characters or 67 characters for multiple parts.


            More information on message length and encoding:
            https://support.transmitsms.com/s/article/44001076957-how-many-characters-can-i-have-in-my-text-message


