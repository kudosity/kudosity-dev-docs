            sender phone number. Messages are sent through agents.


            - Must be a registered RCS Agent identifier

            - Example: "DemoSender"

            - Can be alphanumeric or numeric.
        recipient:
          type: string
          format: phone
          description: >
            The destination number for delivery.

            Can be either in local format or in international format.

            For international format, it should follow E.164 standard.

            [http://en.wikipedia.org/wiki/E.164](http://en.wikipedia.org/wiki/E.164)

            Examples of conversions to E.164 format:

            Australia 0438 333 061 => 61438333061

            UK 07123 456 789 => 447123456789
        content_type:
          type: string
